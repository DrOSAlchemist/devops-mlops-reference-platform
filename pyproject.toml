[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-mlops-reference-platform"
version = "0.1.0"
description = "A local-first reference platform for AI workflow guardrails, DevOps automation, and cloud operations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.3"]

[project.optional-dependencies]
dev = [
	"pytest>=9.0.3",
	"ruff>=0.9",
	"bandit>=1.8.6",
	"pip-audit>=2.9.0",
	"filelock>=3.20.3",
	"msgpack>=1.2.1",
	"requests>=2.33.0",
	"urllib3>=2.7.0",
]

[project.scripts]
platform-guard = "platform_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"