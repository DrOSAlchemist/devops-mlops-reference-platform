stages:
  - verify
  - security

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

python-verify:
  image: python:3.12-slim
  stage: verify
  script:
    - python -m pip install --upgrade pip setuptools
    - python -m pip install -e '.[dev]'
    - ruff check .
    - pytest -q

python-security:
  image: python:3.12-slim
  stage: security
  script:
    - python -m pip install --upgrade pip setuptools
    - python -m pip install -e '.[dev]'
    - pip-audit --skip-editable
    - bandit -q -r src/platform_guard