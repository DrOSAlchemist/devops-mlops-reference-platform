name: Verify platform guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools
      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Scan Python dependencies
        run: pip-audit --skip-editable
      - name: Scan Python source
        run: bandit -q -r src/platform_guard
      - name: Scan repository configuration and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: HIGH,CRITICAL

  infrastructure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, azure, gcp]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform
      - name: Initialize provider example
        run: terraform -chdir=infra/terraform/${{ matrix.provider }} init -backend=false
      - name: Validate provider example
        run: terraform -chdir=infra/terraform/${{ matrix.provider }} validate
      - uses: azure/setup-helm@v4.3.1
      - name: Lint Helm chart
        run: helm lint deploy/helm/platform-guard

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build --file Dockerfile --tag platform-guard:ci .
      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: platform-guard:ci
          scan-type: image
          severity: HIGH,CRITICAL